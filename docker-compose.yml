services:
  orpheus:
    build: .
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"  # Ensure Python logs are flushed immediately in Docker Compose
    volumes:
      - ./bot.py:/app/bot.py  # Mount the entrypoint for faster local development
      - ./src:/app/src        # Mount source modules without exposing the whole repository
    restart: unless-stopped
